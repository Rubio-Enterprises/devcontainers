name: Test features

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # Feature tests build images, so they need a Docker daemon.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check Feature and collection publication identities
        run: bash test/publication-namespace.sh
      - name: Install the Dev Container CLI
        run: npm install -g @devcontainers/cli@0.89.0
      - name: Test the baseline feature on the org base image
        run: >-
          devcontainer features test
          --features baseline
          --base-image mcr.microsoft.com/devcontainers/base:2.2.1-trixie
          --skip-scenarios
          --remote-user root
          .
